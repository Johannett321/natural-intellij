name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The published plugin must never contain Software AG code. src/main must not
      # reference it, and the proprietary jars must never be committed.
      - name: Verify no proprietary dependencies
        run: |
          if grep -rq "com\.softwareag" src/main/; then
            echo "::error::src/main references com.softwareag - that code belongs in src/ndv/"
            grep -rn "com\.softwareag" src/main/ || true
            exit 1
          fi
          if git ls-files | grep -qiE "com\.softwareag.*\.jar|\.pcapng?$"; then
            echo "::error::proprietary jars or protocol captures are committed"
            git ls-files | grep -iE "com\.softwareag.*\.jar|\.pcapng?$" || true
            exit 1
          fi
          echo "OK: no proprietary dependencies in the published sources."

      - name: Build plugin
        run: ./gradlew buildPlugin -PndvEnabled=false

      - name: Run tests
        run: ./gradlew check -PndvEnabled=false

      - name: Verify plugin
        run: ./gradlew verifyPlugin -PndvEnabled=false

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
