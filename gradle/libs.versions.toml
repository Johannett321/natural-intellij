[versions]
# libraries
junit = "4.13.2"
opentest4j = "1.3.0"
flexmark = "0.64.8"
icu4j = "67.1"

# plugins
changelog = "2.5.0"
grammarKit = "2023.3.0.3"
intelliJPlatform = "2.18.1"
kotlin = "2.3.20"
kover = "0.9.7"
qodana = "2025.3.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
flexmark = { group = "com.vladsch.flexmark", name = "flexmark", version.ref = "flexmark" }
flexmark-ext-tables = { group = "com.vladsch.flexmark", name = "flexmark-ext-tables", version.ref = "flexmark" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }
icu4j-charset = { group = "com.ibm.icu", name = "icu4j-charset", version.ref = "icu4j" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
grammarKit = {id = "org.jetbrains.grammarkit", version.ref = "grammarKit"}
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
